
modLoader="javafml"

loaderVersion="${loader_version_range}"

license="${mod_license}"


[[mods]]

modId="${mod_id}"

version="${mod_version}"
logoFile="logo.png"
displayURL="https://github.com/krypt0graphy/New-World-NeoForge"

displayName="${mod_name}"

authors="${mod_authors}"

description='''${mod_description}'''

[[mixins]]
config="newworld.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="blueprint"
    type="required"
    versionRange="${blueprint_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="woodworks"
    type="optional"
    versionRange="[4.0.2,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="boatload"
    type="optional"
    versionRange="[6.0.2,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="nomansland"
    type="optional"
    versionRange="[1.4.6,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="farmersdelight"
    type="optional"
